name: codeql

on:
  push:
    branches: [main]
  pull_request:
  # Lets scripts/sync_upstream.sh dispatch `analyze` on a sync-bot PR
  # branch: a PR opened with GITHUB_TOKEN never fires `pull_request`, and
  # branch protection requires `analyze` to pass.
  workflow_dispatch:
  schedule:
    # Mondays 03:19 UTC. An off-the-hour minute avoids the top-of-hour
    # scheduling crush GitHub's docs warn about.
    - cron: "19 3 * * 1"

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  analyze:
    name: analyze
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Initialize CodeQL
        uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          languages: java-kotlin
          build-mode: manual

      # Upstream hard-wires $HOME/.android/debug.keystore for debug signing
      # (docs/build-baseline.md, "Keystore pitfall"); a fresh runner has no
      # such file, so :app:assembleGmsDebug fails at
      # :app:validateSigningGmsDebug without it. Created inline here rather
      # than via scripts/dev-env.sh, which also pins JAVA_HOME/ANDROID_HOME
      # to dev-machine paths this runner doesn't have.
      - name: Create debug keystore
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -keystore "$HOME/.android/debug.keystore" \
              -alias androiddebugkey -storepass android -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build (gms debug, no tests)
        run: ./gradlew :app:assembleGmsDebug -x test

      # The Gradle and Kotlin daemons (4 GB heap each, gradle.properties) outlive the build, while the
      # analysis sizes itself to the runner's whole RAM; together they got the runner OOM-killed
      # ("The runner has received a shutdown signal") twice on PR #32. Stop them first, and leave the
      # runner itself some headroom.
      - name: Stop build daemons
        run: |
          ./gradlew --stop
          pkill -f KotlinCompileDaemon || true

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          category: "/language:java-kotlin"
          ram: 12288
