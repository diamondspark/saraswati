name = "saraswati-sangat"
main = "src/index.ts"
compatibility_date = "2026-10-18"

[[durable_objects.bindings]]
name = "FAMILY_HUB"
class_name = "FamilyHub"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["FamilyHub"]

# Optional GitHub mirror of feedback (the Worker posts one issue per item). The repo is not a
# secret. The token is: set it with `npx wrangler secret put GITHUB_FEEDBACK_TOKEN` (a
# fine-grained token, Issues: write on this one repo) and never commit it. Without it nothing
# is mirrored. Keep this table above [ai]; wrangler.test.toml carries the same repo line and
# deliberately no token.
# The repo MUST be private: it receives the family's feedback text. The public app repo is
# never the target. Create diamondspark/saraswati-feedback as PRIVATE before setting the token.
[vars]
GITHUB_FEEDBACK_REPO = "diamondspark/saraswati-feedback"

# Ask Saraswati. A binding holds no key. On the Workers Free plan usage past the daily
# allowance fails instead of being billed. vitest loads wrangler.test.toml, which is this
# file minus this section.
[ai]
binding = "AI"
