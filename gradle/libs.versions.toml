[versions]
androidGradlePlugin = "9.4.1"
browser = "1.10.0"
robolectric = "4.17"
androidxTestCore = "1.7.0"
# SARASWATI: Task 12 instrumented egress proof (androidTest only).
androidxTestRunner = "1.7.0"
androidxTestExtJunit = "1.3.0"
json = "20260814"
kotlin = "2.4.20"
# SARASWATI: Task 4 (:update-core) — this pure-JVM module parses the update
# manifest with kotlinx.serialization directly (no Ktor involved), unlike
# every other module here which only pulls kotlinx-serialization-core
# transitively through Ktor. 1.11.0 matches what verification-metadata.xml
# already trusts (resolved transitively elsewhere in the graph already), so
# this adds no new, previously-unvetted artifact.
kotlinxSerializationJson = "1.11.0"
# SARASWATI: Task 5 (:updater) — the installer app's own download client.
# 5.5.0 is not a new, previously-unvetted artifact: gradle/verification-metadata.xml
# already carries full jar/module hashes for "okhttp-android" 5.5.0 (the
# Android-target variant actually resolved here), trusted transitively via
# :app's existing coil/media3/ktor-okhttp dependencies. OkHttp is also the
# HTTP client Task 4's DownloadPolicy review was verified against (no
# second percent-decode pass before path resolution), so this choice keeps
# that verification valid rather than introducing a different client whose
# redirect/decoding behavior would need separately auditing.
okhttp = "5.5.0"
# SARASWATI: Task 7 — ZXing core, used only to draw the owner's pairing QR code
# (QRCodeWriter). Apache-2.0, pure Java, no transitive dependencies.
zxing = "3.5.4"
compose = "1.12.1"
lifecycle = "2.11.0"
material3 = "1.5.0-alpha28"
appcompat = "1.8.0"
media3 = "1.10.1" # 1.11.1 hides Android 17 media controls (#4404)
mediarouter = "1.8.1"
castFramework = "22.3.1"
firebaseMessaging = "26.0.0"
room = "2.8.5"
hilt = "2.60.1"
ktor = "3.6.0"
ksp = "2.3.12"
coil = "3.6.3"
ucrop = "2.2.11"
guava = "33.7.1-jre"
coroutinesGuava = "1.11.0"
activity = "1.13.0"
hiltNavigation = "1.4.0"
datastore = "1.2.1"
composeReorderable = "3.1.0"
shimmer = "1.5.0"
palette = "1.0.0"
desugaring = "2.1.5"
junit = "4.13.2"
timber = "5.0.1"
materialKolor = "5.0.1"
kuromojiIpadic = "0.9.0"
innertubex = "v0.8.4"
# SARASWATI: supply-chain hardening (Task 9) — pinned to 2.0.1, not upstream's
# 2.0.3: JitPack's build is dead for 2.0.3 under every coordinate spelling
# (confirmed via jitpack.io/api/builds/com.github.promeG/tinypinyin, status
# "Error" for 2.0.3/v2.0.3/master; "ok" only for 2.0.1), so restricting the
# JitPack repo's content (this task's whole point) makes 2.0.3 permanently
# unresolvable the moment Gradle needs a fresh dependency graph (e.g. a
# config-cache-busted release build). 2.0.3's only change over 2.0.1 was a
# cncity lexicon data fix (upstream release notes: "修复cncity词库的bug"); the
# app's only call site (LyricsUtils.kt's Pinyin.toPinyin(Char)) is the core
# engine API, unchanged since 2.0.1.
tinypinyin = "2.0.1"
protobuf = "4.36.2"

# SARASWATI: Task 11 (:baselineprofile) — Macrobenchmark + Baseline Profile
# module. 1.5.0 is the latest STABLE release of the whole
# androidx.benchmark/androidx.baselineprofile release train as of this task
# (confirmed against Google's Maven: 1.6.0-alpha01 exists but is alpha-only,
# so 1.5.0 is what "latest stable" resolves to). benchmarkMacro (the
# benchmark-macro-junit4 library) and baselineProfile (the
# androidx.baselineprofile Gradle plugin, backed by
# benchmark-baseline-profile-gradle-plugin) are the same release train and
# happen to share this version, kept as two names for clarity about which
# artifact each pins.
benchmarkMacro = "1.5.0"
baselineProfile = "1.5.0"
uiautomator = "2.4.0"
profileinstaller = "1.4.1"

[libraries]
guava = { module = "com.google.guava:guava", version.ref = "guava" }
coroutines-guava = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-guava", version.ref = "coroutinesGuava" }

gradle = { module = "com.android.tools.build:gradle", version.ref = "androidGradlePlugin" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
zxing-core = { module = "com.google.zxing:core", version.ref = "zxing" }
# SARASWATI: Task 6 (HubClient) — OkHttp's own test server, pinned to the same
# version line as okhttp above (they ship in lock-step). mockwebserver3 is the
# current (non-deprecated) artifact; the legacy "mockwebserver" one is only a
# JUnit4 wrapper around it.
okhttp-mockwebserver = { module = "com.squareup.okhttp3:mockwebserver3", version.ref = "okhttp" }
activity = { module = "androidx.activity:activity-compose", version.ref = "activity" }
hilt-navigation = { module = "androidx.hilt:hilt-navigation-compose", version.ref = "hiltNavigation" }
datastore = { module = "androidx.datastore:datastore-preferences", version.ref = "datastore" }

compose-runtime = { module = "androidx.compose.runtime:runtime", version.ref = "compose" }
compose-foundation = { module = "androidx.compose.foundation:foundation", version.ref = "compose" }
compose-ui = { module = "androidx.compose.ui:ui", version.ref = "compose" }
compose-ui-util = { module = "androidx.compose.ui:ui-util", version.ref = "compose" }
compose-animation = { module = "androidx.compose.animation:animation", version.ref = "compose" }
compose-reorderable = { module = "sh.calvin.reorderable:reorderable", version.ref = "composeReorderable" }

viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
lifecycle-process = { module = "androidx.lifecycle:lifecycle-process", version.ref = "lifecycle" }

material3 = { module = "androidx.compose.material3:material3", version.ref = "material3" }

materialKolor = { module = "com.materialkolor:material-kolor", version.ref = "materialKolor" }

appcompat = { module = "androidx.appcompat:appcompat", version.ref = "appcompat" }
browser = { module = "androidx.browser:browser", version.ref = "browser" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
androidx-test-core = { module = "androidx.test:core", version.ref = "androidxTestCore" }
# SARASWATI: Task 12 instrumented egress proof (androidTest only).
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidxTestRunner" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidxTestExtJunit" }

coil = { module = "io.coil-kt.coil3:coil-compose", version.ref = "coil" }
coil-network-okhttp = { module = "io.coil-kt.coil3:coil-network-okhttp", version.ref = "coil" }
ucrop = { module = "com.github.yalantis:ucrop", version.ref = "ucrop" }

shimmer = { module = "com.valentinilk.shimmer:compose-shimmer", version.ref = "shimmer" }

palette = { module = "androidx.palette:palette", version.ref = "palette" }

media3 = { module = "androidx.media3:media3-exoplayer", version.ref = "media3" }
media3-okhttp = { module = "androidx.media3:media3-datasource-okhttp", version.ref = "media3" }
media3-session = { module = "androidx.media3:media3-session", version.ref = "media3" }
media3-cast = { module = "androidx.media3:media3-cast", version.ref = "media3" }

mediarouter = { module = "androidx.mediarouter:mediarouter", version.ref = "mediarouter" }
cast-framework = { module = "com.google.android.gms:play-services-cast-framework", version.ref = "castFramework" }
firebase-messaging = { module = "com.google.firebase:firebase-messaging", version.ref = "firebaseMessaging" }

room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }

hilt = { module = "com.google.dagger:hilt-android", version.ref = "hilt" }
hilt-compiler = { module = "com.google.dagger:hilt-android-compiler", version.ref = "hilt" }

ktor-client-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktor-client-okhttp = { module = "io.ktor:ktor-client-okhttp", version.ref = "ktor" }
ktor-client-content-negotiation = { module = "io.ktor:ktor-client-content-negotiation", version.ref = "ktor" }
ktor-client-encoding = { module = "io.ktor:ktor-client-encoding", version.ref = "ktor" }
ktor-client-mock = { module = "io.ktor:ktor-client-mock", version.ref = "ktor" }
ktor-serialization-json = { module = "io.ktor:ktor-serialization-kotlinx-json", version.ref = "ktor" }

# SARASWATI: Task 4 (:update-core) — direct kotlinx.serialization dependency,
# see the version comment above.
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinxSerializationJson" }

json = { module = "org.json:json", version.ref = "json" }

desugaring = { module = "com.android.tools:desugar_jdk_libs_nio", version.ref = "desugaring" }

junit = { module = "junit:junit", version.ref = "junit" }

timber = { module = "com.jakewharton.timber:timber", version.ref = "timber" }

innertubex = { module = "com.github.MetrolistGroup.innertubex:innertubex", version.ref = "innertubex" }

kuromoji-ipadic = { module = "com.atilika.kuromoji:kuromoji-ipadic", version.ref = "kuromojiIpadic" }
tinypinyin = { module = "com.github.promeG:tinypinyin", version.ref = "tinypinyin" }

protobuf-javalite = { module = "com.google.protobuf:protobuf-javalite", version.ref = "protobuf" }
protobuf-kotlin-lite = { module = "com.google.protobuf:protobuf-kotlin-lite", version.ref = "protobuf" }

# SARASWATI: Task 11 (:baselineprofile) — the macrobenchmark module's own
# instrumented-test dependencies, plus profileinstaller for :app (reads and
# locally compiles the committed app/src/main/baseline-prof.txt on first
# launch; needed because Saraswati is sideloaded, not Play-distributed, so
# there's no Play Store cloud profile delivery path).
androidx-benchmark-macro-junit4 = { module = "androidx.benchmark:benchmark-macro-junit4", version.ref = "benchmarkMacro" }
androidx-test-uiautomator = { module = "androidx.test.uiautomator:uiautomator", version.ref = "uiautomator" }
androidx-profileinstaller = { module = "androidx.profileinstaller:profileinstaller", version.ref = "profileinstaller" }

[plugins]
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
kotlin-ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
protobuf = { id = "com.google.protobuf", version = "0.10.0" }
# SARASWATI: Task 11 — androidx.baselineprofile Gradle plugin, applied to
# both :app (consumer) and :baselineprofile (producer/test module).
baseline-profile = { id = "androidx.baselineprofile", version.ref = "baselineProfile" }
